<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9"
    crossorigin="anonymous"
  />

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
    crossorigin="anonymous"
  ></script>

  <!-- Custom CSS and JavaScript -->
  <link rel="stylesheet" href="../assets/css/style.css?v=2">
  <script src="../assets/js/project.js"></script>

  <title>Melbourne Watch Gallery</title>
</head>
<body>

  <!-- Navigation bar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html"><h5>Melbourne Watch Gallery</h5></a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="about.html"><h5>About Us</h5></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="login.html"><h5>Login</h5></a>
          </li>
        </ul>

        <!-- Search box only for UI display -->
        <div class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
          <button class="btn btn-outline-success" type="button">Search</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <div class="header">
    <img
      class="logo"
      src="https://th.bing.com/th/id/OIP.VhJAXMCE6eyDWvqXVnDrrwAAAA?w=129&h=169&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3"
      alt="Melbourne Watch Gallery Logo"
    />
    <h1 class="site-title">Melbourne Watch Gallery</h1>
  </div>

  <!-- Login Form -->
  <div class="login-container">
    <form class="login" autocomplete="off">
      <h1 class="login-title">Login</h1>

      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" autocomplete="off" placeholder="Enter username">
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" autocomplete="off" placeholder="Enter password">
      </div>

      <button type="submit" class="btn btn-primary">Login</button>
    </form>
  </div>

  <!-- Clear login form -->
  <script>
    function clearLoginForm(){
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
    }

    window.onload = function(){
      clearLoginForm();
      setTimeout(clearLoginForm,100);
      setTimeout(clearLoginForm,500);
    };
  </script>

</body>
</html>
